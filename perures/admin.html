<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PeruRes - Actualizador de restaurantes</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="icon" href="data:,">
</head>

<body>

    <div class="panel-admin-sticky">

        <header class="admin-header">

            <span class="admin-kicker">
                🇵🇪 PERURES ADMIN
            </span>

            <div class="titulo-admin">

                <h1>
                    Gestión del catálogo
                </h1>

                <img src="../assets/escudo.jpg" alt="Escudo del Perú" class="escudo-peru">

            </div>

            <p>
                Descubre, valida y administra restaurantes
                peruanos de toda la Comunidad de Madrid.
            </p>

        </header>


        <div class="acciones-admin">

            <button id="btn-actualizar-catalogo">
                <span class="texto-boton">
                    Actualizar catálogo
                </span>
            </button>

            <button id="btn-validar-catalogo">
                Validar catálogo
            </button>

        </div>


        <!-- ==================================================
         FILA INFERIOR:
         ESTADO + BUSCADOR
    ================================================== -->

        <div class="barra-admin">

            <p id="estado-actualizacion">
                Esperando...
            </p>


            <div class="buscador-admin">

                <input type="text" id="buscar-revision" placeholder="Buscar por nombre o dirección...">

            </div>

        </div>

    </div>

    <hr>


    <section id="revision-catalogo">

        <div class="catalogo-cabecera">

            <h2>
                Catálogo de restaurantes
            </h2>

            <div class="catalogo-tabs">

                <button class="tab-catalogo activo" data-vista="todos">
                    Todos
                    <span id="contador-todos">0</span>
                </button>

                <button class="tab-catalogo" data-vista="validados">
                    ✅ Validados
                    <span id="contador-validados">0</span>
                </button>

                <button class="tab-catalogo" data-vista="revisar">
                    🟡 Pendientes
                    <span id="contador-pendientes">0</span>
                </button>

                <button class="tab-catalogo" data-vista="descartados">
                    ❌ Descartados
                    <span id="contador-descartados">0</span>
                </button>

            </div>

        </div>

        <p id="contador-revision">
            Todavía no se ha realizado ninguna validación.
        </p>

        <div id="lista-revision"></div>

    </section>


    <!-- ==================================================
         FIREBASE SDK
    ================================================== -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


    <!-- ==================================================
         GOOGLE PLACES
    ================================================== -->

    <script src="js/config.js"></script>


    <!-- ==================================================
         ACTUALIZADOR DE RESTAURANTES
    ================================================== -->

    <script src="js/actualizar-restaurantes.js"></script>

    <!-- ==================================================
     HTML2CANVAS
     Utilizado únicamente para el efecto de desintegración
================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>

    <!-- ==================================================
         ADMINISTRACIÓN DE PERURES
    ================================================== -->

    <script type="module">


        // ==================================================
        // FIREBASE
        // ==================================================

        import {
            obtenerFirebaseDB
        } from "../js/firebase-config.js";


        obtenerFirebaseDB();


        // ==================================================
        // VALIDADOR
        // ==================================================

        await import(
            "./js/validar-restaurantes.js"
        );


        // ==================================================
        // ELEMENTOS DEL DOM
        // ==================================================

        const botonActualizar =
            document.getElementById(
                "btn-actualizar-catalogo"
            );


        const botonValidar =
            document.getElementById(
                "btn-validar-catalogo"
            );


        const estadoActualizacion =
            document.getElementById(
                "estado-actualizacion"
            );


        // ==================================================
        // PROGRESO REAL DEL BOTÓN ACTUALIZAR
        // ==================================================

        const textoBotonActualizar =
            botonActualizar.querySelector(
                ".texto-boton"
            );


        function pintarProgresoActualizacion(
            porcentaje
        ) {

            const progreso =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            porcentaje
                        )
                    )
                );


            /*
             * JavaScript solo comunica el porcentaje.
             * CSS se encarga de dibujar la capa gris.
             */
            botonActualizar.style.setProperty(
                "--progreso",
                progreso + "%"
            );


            textoBotonActualizar.textContent =
                "Actualizando... " +
                progreso +
                "%";
        }


        function limpiarProgresoActualizacion() {

            botonActualizar.classList.remove(
                "actualizando"
            );


            botonActualizar.style.removeProperty(
                "--progreso"
            );


            textoBotonActualizar.textContent =
                "Actualizar catálogo";
        }


        // ==================================================
        // BOTÓN ACTUALIZAR CATÁLOGO
        // ==================================================

        botonActualizar.addEventListener(
            "click",
            async function () {

                botonActualizar.classList.add(
                    "actualizando"
                );


                /*
                 * Lo bloqueamos manualmente con pointer-events
                 * mientras el rastreo está activo.
                 *
                 * El botón conserva su fondo rojo y CSS dibuja
                 * encima la capa gris que representa lo pendiente.
                 */
                botonActualizar.setAttribute(
                    "aria-disabled",
                    "true"
                );


                botonActualizar.style.pointerEvents =
                    "none";


                pintarProgresoActualizacion(
                    0
                );


                estadoActualizacion.textContent =
                    "Rastreando restaurantes...";


                try {

                    const catalogo =
                        await actualizarCatalogo(
                            function (
                                porcentaje,
                                mensaje
                            ) {

                                pintarProgresoActualizacion(
                                    porcentaje
                                );


                                if (mensaje) {

                                    estadoActualizacion.textContent =
                                        mensaje;
                                }
                            }
                        );


                    pintarProgresoActualizacion(
                        100
                    );


                    /*
                     * IMPORTANTE:
                     * actualizarCatalogo() guarda el catálogo nuevo en Firebase,
                     * pero la lista visible del administrador ya estaba renderizada
                     * con los datos anteriores.
                     *
                     * Volvemos a ejecutar la validación para releer Firebase,
                     * aplicar las decisiones existentes y repintar contadores/tarjetas.
                     */
                    estadoActualizacion.textContent =
                        "Actualización terminada. Refrescando catálogo...";


                    await window.validarCatalogo();


                    const estadisticas =
                        catalogo.estadisticasActualizacion ||
                        window.estadisticasActualizacionPeruRes ||
                        null;


                    if (estadisticas) {

                        estadoActualizacion.textContent =
                            "Actualización terminada · " +
                            "Encontrados: " +
                            estadisticas.encontrados +
                            " · Nuevos: " +
                            estadisticas.nuevos +
                            " · Actualizados: " +
                            estadisticas.actualizados +
                            " · Total: " +
                            estadisticas.total;

                    } else {

                        estadoActualizacion.textContent =
                            "Catálogo terminado: " +
                            catalogo.length +
                            " restaurantes persistentes.";
                    }


                    /*
                     * Dejamos visible el 100% un instante
                     * antes de devolver el botón a su estado normal.
                     */
                    await new Promise(
                        function (resolver) {

                            setTimeout(
                                resolver,
                                450
                            );
                        }
                    );

                } catch (error) {

                    console.error(
                        "Error actualizando el catálogo:",
                        error
                    );


                    estadoActualizacion.textContent =
                        "Ha ocurrido un error durante la actualización.";

                } finally {

                    botonActualizar.removeAttribute(
                        "aria-disabled"
                    );


                    botonActualizar.style.removeProperty(
                        "pointer-events"
                    );


                    limpiarProgresoActualizacion();
                }
            }
        );


        // ==================================================
        // BOTÓN VALIDAR CATÁLOGO
        // ==================================================

        botonValidar.addEventListener(
            "click",
            async function () {

                botonValidar.disabled = true;

                botonValidar.textContent =
                    "Validando...";

                estadoActualizacion.textContent =
                    "Validando catálogo...";


                try {

                    const resultado =
                        await window.validarCatalogo();


                    estadoActualizacion.textContent =
                        "Validación terminada | " +
                        "Validados: " +
                        resultado.validados.length +
                        " | Revisar: " +
                        resultado.revisar.length +
                        " | Descartados: " +
                        resultado.descartados.length;

                } catch (error) {

                    console.error(
                        "Error validando catálogo:",
                        error
                    );


                    estadoActualizacion.textContent =
                        "Ha ocurrido un error durante la validación.";
                }


                botonValidar.disabled = false;

                botonValidar.textContent =
                    "Validar catálogo";
            }
        );


        // ==========================================================
        // PANEL SUPERIOR
        // OCULTAR MIENTRAS HAY SCROLL
        // MOSTRAR CUANDO EL USUARIO SE DETIENE
        // ==========================================================

        const panelAdmin =
            document.querySelector(
                ".panel-admin-sticky"
            );


        let temporizadorScroll =
            null;


        if (panelAdmin) {

            window.addEventListener(
                "scroll",
                function () {

                    panelAdmin.classList.add(
                        "panel-oculto"
                    );


                    clearTimeout(
                        temporizadorScroll
                    );


                    temporizadorScroll =
                        setTimeout(
                            function () {

                                panelAdmin.classList.remove(
                                    "panel-oculto"
                                );

                            },
                            300
                        );

                },
                {
                    passive: true
                }
            );

        } else {

            console.error(
                "No se encontró .panel-admin-sticky"
            );
        }

    </script>

</body>

</html>
